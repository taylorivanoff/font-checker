<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app" id="app">
    <header class="titlebar">
      <div class="titlebar-drag">
        <h1 class="app-title">Font Checker</h1>
        <span class="status-badge ok" id="status-badge">Ready</span>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="text-btn" id="btn-settings">Settings</button>
      </div>
    </header>

    <div class="progress-bar hidden" id="progress-bar">
      <span class="progress-text" id="progress-text">Scanning…</span>
    </div>

    <main class="workspace">
      <div class="toolbar">
        <label class="field" style="flex: 1; min-width: 160px; margin: 0;">
          <span class="hidden">URL</span>
          <input type="url" id="field-url" placeholder="https://example.com/fonts/…" list="recent-urls" />
          <datalist id="recent-urls"></datalist>
        </label>
        <label class="field" style="width: 120px; margin: 0;">
          <span class="hidden">Mode</span>
          <select id="field-mode">
            <option value="discover">Discover</option>
            <option value="download">Download</option>
            <option value="convert">Convert to OTF</option>
          </select>
        </label>
        <button type="button" class="text-btn primary" id="btn-scan">Scan</button>
      </div>

      <div class="toolbar">
        <button type="button" class="text-btn" id="btn-pick-out">Output…</button>
        <button type="button" class="text-btn" id="btn-open-out" disabled>Open folder</button>
        <div class="spacer"></div>
        <span class="meta" id="out-label"></span>
      </div>

      <div class="split">
        <section class="panel">
          <header class="panel-header">
            <h2 id="results-label">Fonts</h2>
          </header>
          <div class="list" id="results"></div>
        </section>

        <section class="panel">
          <header class="panel-header">
            <h2>Details</h2>
            <button type="button" class="text-btn" id="btn-reveal" disabled>Reveal file</button>
          </header>
          <pre class="preview" id="detail">Scan a page to discover fonts.</pre>
        </section>
      </div>

      <div class="warnings" id="warnings"></div>
    </main>

    <p class="hint" id="hint">Discover webfonts, download with browser-like headers, unwrap woff2 → OTF.</p>
  </div>

  <div class="overlay hidden" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet compact">
      <header class="sheet-header">
        <h2 id="settings-title">Settings</h2>
        <button type="button" class="text-btn" id="settings-close">Close</button>
      </header>

      <label class="toggle-row">
        <span>Always on top</span>
        <input type="checkbox" id="setting-aot" />
      </label>
      <label class="toggle-row">
        <span>Start minimised</span>
        <input type="checkbox" id="setting-minimised" />
      </label>
      <label class="field">
        <span>Timeout (ms)</span>
        <input type="number" id="setting-timeout" min="5000" max="120000" step="1000" />
      </label>
      <label class="field">
        <span>Transparency</span>
        <input type="range" id="setting-opacity" min="0" max="65" step="1" />
        <output id="setting-opacity-out">6%</output>
      </label>
      <p class="meta" id="settings-meta"></p>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>

</html>
