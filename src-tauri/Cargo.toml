[package]
name = "font-checker"
version = "1.0.15"
description = "Desktop app and CLI to detect webpage fonts and convert WOFF2 to OTF"
authors = ["Taylor Ivanoff"]
edition = "2021"

[lib]
name = "font_checker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-tray-base = { path = "../../tauri-tray-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
which = "7"
