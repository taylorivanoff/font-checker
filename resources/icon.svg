<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Font Checker">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#243b4a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a4550"/>
      <stop offset="100%" stop-color="#2c343c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- browser / page card -->
  <rect x="156" y="200" width="712" height="560" rx="72" fill="url(#panel)"/>

  <!-- window chrome dots -->
  <circle cx="232" cy="268" r="18" fill="#8b949e" opacity="0.45"/>
  <circle cx="288" cy="268" r="18" fill="#8b949e" opacity="0.35"/>
  <circle cx="344" cy="268" r="18" fill="#8b949e" opacity="0.25"/>

  <!-- URL / address bar -->
  <rect x="220" y="320" width="584" height="88" rx="44" fill="#1c1c1e" opacity="0.55"/>
  <!-- lock / link glyph -->
  <circle cx="278" cy="364" r="18" fill="none" stroke="#4cc2ff" stroke-width="8"/>
  <rect x="268" y="364" width="20" height="22" rx="5" fill="#4cc2ff"/>
  <!-- URL dots / segments -->
  <rect x="320" y="350" width="220" height="16" rx="8" fill="#8b949e"/>
  <rect x="320" y="382" width="140" height="14" rx="7" fill="#8b949e" opacity="0.45"/>
  <rect x="560" y="350" width="96" height="16" rx="8" fill="#4cc2ff" opacity="0.7"/>

  <!-- page content lines (fonts on page) -->
  <rect x="220" y="460" width="280" height="22" rx="8" fill="#8b949e" opacity="0.55"/>
  <rect x="220" y="510" width="360" height="18" rx="7" fill="#8b949e" opacity="0.35"/>
  <rect x="220" y="554" width="300" height="18" rx="7" fill="#8b949e" opacity="0.28"/>
  <rect x="220" y="598" width="200" height="18" rx="7" fill="#8b949e" opacity="0.2"/>

  <!-- magnifier -->
  <g transform="translate(520 430)" filter="url(#glow)">
    <circle cx="140" cy="140" r="128" fill="none" stroke="#4cc2ff" stroke-width="44"/>
    <circle cx="140" cy="140" r="78" fill="#1c1c1e" opacity="0.35"/>
    <rect x="228" y="248" width="44" height="160" rx="22" fill="#4cc2ff" transform="rotate(-40 250 328)"/>
  </g>
</svg>
